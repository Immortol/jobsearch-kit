name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jsk
          POSTGRES_PASSWORD: jsk
          POSTGRES_DB: jsk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jsk" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://jsk:jsk@localhost:5432/jsk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
