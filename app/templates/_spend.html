{# Always visible spend on the user's own API key (decision 0009). Re-sent out of band when a
   reply finishes, so it stays current without a reload. #}
{% if spend is not none %}
<a id="spend" class="spend" href="/settings/key"{% if oob %} hx-swap-oob="true"{% endif %}
   title="{{ _('Estimate from the tokens of each reply. The exact amount is in your Anthropic console.') }}">
  {{ _("Spent: {month} this month · {total} in total", month=spend.month|money, total=spend.total|money) }}
</a>
{% endif %}
